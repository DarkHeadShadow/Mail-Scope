name: Windows tests and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install test requirements
        run: py -3.13 -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: py -3.13 -m unittest discover -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64

      - name: Build Windows application
        run: .\build_windows.bat

      - name: Package onedir application
        run: Compress-Archive -Path .\dist\Mail-Scope -DestinationPath .\dist\Mail-Scope-windows-x64.zip

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" ".\dist\Mail-Scope-windows-x64.zip" --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" ".\dist\Mail-Scope-windows-x64.zip" --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
